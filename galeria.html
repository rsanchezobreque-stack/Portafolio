<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Galería | Raixez</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Ajustes para evitar que la imagen se corte y agregar cursor de clic */
    .gallery-slide img {
      max-height: 65vh;
      width: auto;
      margin: 0 auto;
      object-fit: contain;
      cursor: pointer;
      transition: transform 0.2s ease-in-out;
    }
    .gallery-slide img:hover {
      transform: scale(1.02);
    }
  </style>
</head>

<body data-page="galeria">

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNavbar">
    <div class="container">

      <a class="navbar-brand logo" href="index.html">
        <span>&lt;</span>Raixez<span>/&gt;</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuNavegacion">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" data-page-link="inicio" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" data-page-link="sobre-mi" href="sobre-mi.html">Sobre mí</a></li>
          <li class="nav-item"><a class="nav-link" data-page-link="habilidades" href="habilidades.html">Habilidades</a></li>
          <li class="nav-item"><a class="nav-link" data-page-link="estudios" href="estudios.html">Estudios</a></li>
          <li class="nav-item"><a class="nav-link" data-page-link="proyectos" href="proyectos.html">Proyectos</a></li>
          <li class="nav-item"><a class="nav-link" data-page-link="galeria" href="galeria.html">Galería</a></li>
          <li class="nav-item"><a class="nav-link" data-page-link="contacto" href="contacto.html">Contacto</a></li>
        </ul>
      </div>

    </div>
  </nav>

  <main class="page-main">
    <section class="content-page">
      <div class="container">

        <div class="page-header" data-aos="fade-down">
          <p>05 — GALERÍA</p>
          <h1>Algunos trabajos</h1>
        </div>

        <div id="galleryCarousel" class="carousel slide gallery-carousel" data-bs-ride="carousel" data-aos="zoom-in">

          <div class="carousel-indicators">
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="0" class="active" aria-current="true"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="2"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="3"></button>
          </div>

          <div class="carousel-inner text-center">

            <div class="carousel-item active">
              <div class="gallery-slide">
                <img src="img/trabajo-1.jpg" class="d-block img-fluid rounded" alt="Trabajo 1" onclick="verImagenCompleta(this.src)">
              </div>
            </div>

            <div class="carousel-item">
              <div class="gallery-slide">
                <img src="img/trabajo-2.jpg" class="d-block img-fluid rounded" alt="Trabajo 2" onclick="verImagenCompleta(this.src)">
              </div>
            </div>

            <div class="carousel-item">
              <div class="gallery-slide">
                <img src="img/trabajo-3.jpg" class="d-block img-fluid rounded" alt="Trabajo 3" onclick="verImagenCompleta(this.src)">
              </div>
            </div>

            <div class="carousel-item">
              <div class="gallery-slide">
                <img src="img/trabajo-4.jpg" class="d-block img-fluid rounded" alt="Trabajo 4" onclick="verImagenCompleta(this.src)">
              </div>
            </div>

          </div>

          <button class="carousel-control-prev" type="button" data-bs-target="#galleryCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
          </button>

          <button class="carousel-control-next" type="button" data-bs-target="#galleryCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
          </button>

        </div>

      </div>
    </section>
  </main>

  <!-- MODAL PARA VER LA IMAGEN COMPLETA -->
  <div class="modal fade" id="modalImagenCompleta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-0 pb-0">
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body text-center p-3">
          <img id="imagenModalSrc" src="" class="img-fluid rounded" alt="Imagen ampliada" style="max-height: 85vh; object-fit: contain;">
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <div class="footer-logo">&lt;Raixez/&gt;</div>
      <p>Diseñado y desarrollado por Raúl Elías Sánchez Obreque</p>
      <p id="copyright">© Raixez</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="js/script.js"></script>

  <script>
    function verImagenCompleta(src) {
      document.getElementById('imagenModalSrc').src = src;
      var modal = new bootstrap.Modal(document.getElementById('modalImagenCompleta'));
      modal.show();
    }
  </script>

</body>
</html>
